# 摄影会报名系统 · 隔离式生产部署（IP 内网测试版）
# 与服务器上已有项目完全隔离：独立 compose 项目名、独立网络、独立数据卷、独立数据库。
# 未映射 server 到宿主机，API 仅经 Nginx 反向代理访问；MySQL 仅监听 127.0.0.1:3307。
# 本文件不含任何删除、重置、停服、DROP 操作。
name: photo-club-prod

services:
  mysql:
    image: mysql:8.0
    container_name: photo-club-mysql
    command: >
      --default-time-zone=+00:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: photo_club
      MYSQL_USER: photo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    volumes:
      - photo_club_mysql_data:/var/lib/mysql
    ports:
      # 仅本机可访问，便于宝塔/命令行排查；不要对公网放行 3307
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: photo-club/server:local
    container_name: photo-club-server
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: photo
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: photo_club
      DB_POOL_SIZE: "10"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: "28800"
      REFRESH_TOKEN_TTL_DAYS: "30"
      # 与浏览器地址栏完全一致；后端 CSRF 的 Origin 白名单也取自这里
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      TRUST_PROXY: "true"
      LOG_LEVEL: info
      # 后台上传图片的落盘目录（容器内路径），与下方 volumes 对应
      UPLOAD_DIR: /app/apps/server/data/uploads
    volumes:
      # 图片存在宿主机，重建容器不丢图；deploy.sh 会先 mkdir
      - ./data/uploads:/app/apps/server/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    # 不对宿主机暴露端口：API 只能通过 Nginx 的 /api 反代访问
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: photo-club-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/web:/usr/share/nginx/web:ro
      - ./public/admin:/usr/share/nginx/admin:ro
      # 上传的图片与 server 容器共用同一份宿主机目录：
      # 图片由 Nginx 直接读盘提供，不再依赖「Nginx → server → Express 静态托管」这条反代链。
      # 之前那条链任一环不通，/uploads/ 就会回落到 SPA 的 index.html，
      # 浏览器拿到 HTML 当图片渲染 → 页面裂图（文件在服务器上却看不见）。
      - ./data/uploads:/usr/share/nginx/uploads:ro
    ports:
      # 仅本机监听，供宝塔 Nginx 整站反代；不再对公网暴露 8081/8082
      - "127.0.0.1:8081:8081"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  photo_club_mysql_data:
