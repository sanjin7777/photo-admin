# 方案 A：单域名 https://www.catpaw.art
# 宝塔 Nginx 负责 80/443、Let's Encrypt 证书与强制 HTTPS，并把整站反代到本机 8081。
# 本容器只做路径分发：/ 前台、/admin/ 后台、/api/ 后端；三者同源，不存在跨域。
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/web;
    index index.html;
    # 全局兜底：静态资源很小，1m 足够
    client_max_body_size 1m;
    # 显式声明 UTF-8：避免浏览器按系统默认编码（GBK）解析导致中文乱码
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    # 安全头经宝塔反代透传到浏览器；style 需 unsafe-inline（Vant / Element Plus 内联样式）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    # 后台上传的图片：优先由 Nginx 直接读宿主机上的 uploads 目录提供
    # （与 server 容器共用同一份数据，见 docker-compose.prod.yml 的卷挂载）。
    # 读不到时回退到反代 server:3000 —— server 容器里的 Express 也托管同一份目录。
    # 两条路任一可用即可显示，绝不回落到下面的 SPA index.html：
    # 一旦回落，浏览器会把 HTML 当图片渲染 → 页面裂图（但文件明明在服务器上）。
    location /uploads/ {
        root /usr/share/nginx;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @uploads_via_api;
    }

    # 兜底：磁盘路径不可用时走 API 容器（它和 Nginx 挂载的是同一个宿主机目录）
    location @uploads_via_api {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        # 图片上传与 Excel 批量导入走这里，必须放宽到 20m；
        # 否则超过全局 1m 的请求会在到达 Express 前就被 413 拒绝，
        # 前端拿到 HTML 而非 JSON，表现为「上传失败但看不出原因」。
        client_max_body_size 20m;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_read_timeout 30s;
    }

    # admin 构建 base=/admin/：/admin/assets/x.js → /usr/share/nginx/admin/assets/x.js
    location /admin/ {
        root /usr/share/nginx;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
